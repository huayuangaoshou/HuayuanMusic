name: Release disabled for Huayuan Music P1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-blocked:
    runs-on: windows-latest
    steps:
      - name: Refuse packaging and publishing
        shell: pwsh
        run: throw 'P1 has no approved installer, signing identity or update channel. See docs/P1_CODEX_ACCEPTANCE.md.'
